<text x="450.0" y="27" text-anchor="middle" fill="#3d3d3d" font-size="13">yuuki@linux — herdr — ~</text>
<g class="a2"><text x="24" y="68"><tspan fill="#b48cff">❯</tspan> yuuki boot --profile github</text><rect class="a1" x="44.0" y="53" height="20" fill="#000000" style="transform-origin:right center;transform-box:fill-box"/></g><g class="a3"><text y="98"><tspan x="24" fill="#7dd3a0">✓</tspan><tspan x="44" fill="#6a6a6a">kernel</tspan><tspan x="150" fill="#d4d4d4">linux</tspan><tspan x="300" fill="#3d3d3d">daily driver, no exceptions</tspan></text></g><g class="a4"><text y="122"><tspan x="24" fill="#7dd3a0">✓</tspan><tspan x="44" fill="#6a6a6a">theme</tspan><tspan x="150" fill="#d4d4d4">vanta-black</tspan><tspan x="300" fill="#3d3d3d">#000000 · light mode not found</tspan></text></g><g class="a5"><text y="146"><tspan x="24" fill="#7dd3a0">✓</tspan><tspan x="44" fill="#6a6a6a">shell</tspan><tspan x="150" fill="#d4d4d4">terminal-first</tspan><tspan x="300" fill="#3d3d3d">GUI is a fallback</tspan></text></g><g class="a6"><text y="170"><tspan x="24" fill="#7dd3a0">✓</tspan><tspan x="44" fill="#6a6a6a">runtime</tspan><tspan x="150" fill="#d4d4d4">herdr</tspan><tspan x="300" fill="#3d3d3d">agents keep working after I detach</tspan></text></g><g class="a8"><text x="24" y="208"><tspan fill="#b48cff">❯</tspan> cat ~/.config/yuuki/profile.toml</text><rect class="a7" x="44.0" y="193" height="20" fill="#000000" style="transform-origin:right center;transform-box:fill-box"/></g><g class="a9"><text y="234"><tspan x="44" fill="#b48cff">[human]</tspan></text></g><g class="a10"><text y="256"><tspan x="44" fill="#6a6a6a">name</tspan><tspan x="130" fill="#c9b8ff">= "Yuuki"</tspan><tspan x="300" fill="#3d3d3d">· fullstack developer</tspan></text></g><g class="a11"><text y="278"><tspan x="44" fill="#6a6a6a">focus</tspan><tspan x="130" fill="#c9b8ff">= ["ai/ml", "llms", "agents", "cli tooling"]</tspan></text></g><g class="a12"><text y="300"><tspan x="44" fill="#6a6a6a">editors</tspan><tspan x="130" fill="#c9b8ff">= ["neovim", "coding agents"]</tspan></text></g><g class="a13"><text y="344"><tspan x="44" fill="#b48cff">[stack]</tspan></text></g><g class="a14"><text y="366"><tspan x="44" fill="#6a6a6a">python</tspan><tspan x="130" fill="#c9b8ff">= ["langgraph", "fastapi", "xgboost", "shap", "chroma", "ollama"]</tspan></text></g><g class="a15"><text y="388"><tspan x="44" fill="#6a6a6a">web</tspan><tspan x="130" fill="#c9b8ff">= ["typescript", "javascript"]</tspan></text></g><g class="a16"><text y="410"><tspan x="44" fill="#6a6a6a">systems</tspan><tspan x="130" fill="#c9b8ff">= ["go", "rust", "c++"]</tspan></text></g><g class="a18"><text x="24" y="446"><tspan fill="#b48cff">❯</tspan> yuuki agents ls</text><rect class="a17" x="44.0" y="431" height="20" fill="#000000" style="transform-origin:right center;transform-box:fill-box"/></g><g class="a19"><text y="472"><tspan x="44" fill="#6a6a6a">NAME</tspan><tspan x="210" fill="#6a6a6a">STATUS</tspan><tspan x="300" fill="#6a6a6a">TASK</tspan></text></g><g class="a20"><text y="496"><tspan x="44" fill="#d4d4d4">omoikane</tspan><tspan x="210" fill="#7dd3a0">working</tspan><tspan x="300" fill="#d4d4d4">llm-maintained wiki, ingests sources on its own</tspan></text></g><g class="a21"><text y="520"><tspan x="44" fill="#d4d4d4">credit-guard</tspan><tspan x="210" fill="#7dd3a0">working</tspan><tspan x="300" fill="#d4d4d4">xgboost + shap, decisions explained by an llm</tspan></text></g><g class="a22"><text y="544"><tspan x="44" fill="#d4d4d4">support-bot</tspan><tspan x="210" fill="#6a6a6a">idle</tspan><tspan x="300" fill="#d4d4d4">langgraph supervisor · rag over chroma · fastapi</tspan></text></g><g class="a23"><text y="568"><tspan x="44" fill="#d4d4d4">stackradar</tspan><tspan x="210" fill="#6a6a6a">idle</tspan><tspan x="300" fill="#d4d4d4">job-market tech rankings · local rag with ollama</tspan></text></g><g class="a24"><text y="592"><tspan x="44" fill="#d4d4d4">agent-dotfiles</tspan><tspan x="210" fill="#7dd3a0">working</tspan><tspan x="300" fill="#d4d4d4">skills, agents and workflows for coding agents</tspan></text></g><g class="a25"><text y="616"><tspan x="44" fill="#d4d4d4">human</tspan><tspan x="210" fill="#f0b86e">blocked</tspan><tspan x="300" fill="#d4d4d4">waiting for coffee</tspan></text></g><g class="a27"><text x="24" y="656"><tspan fill="#b48cff">❯</tspan> yuuki stats</text><rect class="a26" x="44.0" y="641" height="20" fill="#000000" style="transform-origin:right center;transform-box:fill-box"/></g><g class="a28"><text y="680"><tspan x="44" fill="#6a6a6a">repos</tspan><tspan x="110" fill="#d4d4d4">20</tspan><tspan x="170" fill="#6a6a6a">followers</tspan><tspan x="260" fill="#d4d4d4">12</tspan><tspan x="320" fill="#6a6a6a">top</tspan><tspan x="360" fill="#b48cff">Python  JavaScript  C#</tspan></text></g><g class="a29"><text y="714"><tspan x="24" fill="#6a6a6a">ctx</tspan></text><rect x="64" y="705" width="300" height="6" rx="3" fill="#161616"/><rect class="ctx" x="64" y="705" height="6" rx="3" fill="url(#g)"/><text y="714"><tspan x="378" fill="#3d3d3d">building things where a model does part of the thinking</tspan></text></g><g class="a30"><text y="746"><tspan x="24" fill="#b48cff">❯</tspan><tspan x="40" class="cur" fill="#b48cff">▍</tspan></text></g>
