# Re-renders header.svg once a day so the numbers on the profile stay honest
# without anyone remembering to run bin/render.
#
# ACCESS_TOKEN (repository secret, classic PAT with `repo` + `read:user`) is
# what makes private contributions and private-repo line counts visible; the
# built-in GITHUB_TOKEN only sees this repository, so it is the fallback.
name: update profile

on:
  schedule:
    - cron: '0 6 * * *' # 03:00 in São Paulo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python bin/render
      - name: Publish when the numbers moved
        run: |
          git config user.name 'YuukiFST'
          git config user.email '115494802+YuukiFST@users.noreply.github.com'
          git add header.svg
          git diff --cached --quiet && exit 0
          git commit -m 'chore(profile): refresh header'
          git push
