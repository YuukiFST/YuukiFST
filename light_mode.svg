<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,monospace" width="985px" height="540px" font-size="16px">
<style>
@font-face {
src: local('Consolas'), local('Consolas Bold');
font-family: 'ConsolasFallback';
font-display: swap;
-webkit-size-adjust: 109%;
size-adjust: 109%;
}
.prompt-host {fill: #268bd2;}
.prompt-path {fill: #859900;}
.command {fill: #657b83;}
.key {fill: #cb4b16;}
.value {fill: #073642;}
.dim {fill: #93a1a1;}
.addColor {fill: #859900;}
.delColor {fill: #dc322f;}
.cursor {fill: #6c71c4;}
text, tspan {white-space: pre;}

@keyframes ascii-pulse {
  0%, 100% { opacity: 0.55; fill: #268bd2; }
  50% { opacity: 1; fill: #268bd2; }
}
@keyframes cursor-blink {
  0%, 45% { opacity: 1; }
  50%, 100% { opacity: 0; }
}
@keyframes scanline {
  0% { transform: translateY(32px); opacity: 0; }
  8% { opacity: 0.12; }
  92% { opacity: 0.12; }
  100% { transform: translateY(188px); opacity: 0; }
}
.ascii-line {
  fill: #268bd2;
  animation: ascii-pulse 2.8s ease-in-out infinite;
}
.ascii-row-0 { animation-delay: 0.00s; }
.ascii-row-1 { animation-delay: 0.18s; }
.ascii-row-2 { animation-delay: 0.36s; }
.ascii-row-3 { animation-delay: 0.54s; }
.ascii-row-4 { animation-delay: 0.72s; }
.cursor { animation: cursor-blink 1.05s step-end infinite; }
#ascii-scanline {
  fill: url(#scanline-gradient);
  animation: scanline 5s linear infinite;
}

</style>
<defs>
<linearGradient id="scanline-gradient" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#fdf6e3" stop-opacity="0"/>
<stop offset="45%" stop-color="#268bd2" stop-opacity="0.35"/>
<stop offset="55%" stop-color="#268bd2" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#fdf6e3" stop-opacity="0"/>
</linearGradient>
</defs>
<rect width="985px" height="540px" fill="#fdf6e3" rx="12"/>
<rect x="1" y="1" width="983px" height="538px" fill="none" stroke="#93a1a1" stroke-width="2" rx="12"/>
<rect id="ascii-scanline" x="12" y="0" width="290" height="24" opacity="0"/>
<text x="15" y="30" fill="#657b83" class="ascii">
<tspan x="15" y="40" class="ascii-line ascii-row-0">#   # #   # #   # #   # ### </tspan>
<tspan x="15" y="60" class="ascii-line ascii-row-1"> # #  #   # #   # #  #   #  </tspan>
<tspan x="15" y="80" class="ascii-line ascii-row-2">  #   #   # #   # ###    #  </tspan>
<tspan x="15" y="100" class="ascii-line ascii-row-3">  #   #   # #   # #  #   #  </tspan>
<tspan x="15" y="120" class="ascii-line ascii-row-4">  #    ###   ###  #   # ### </tspan>
