<tspan x="300" y="400" class="terminal-row" style="animation-delay:12.95s"><tspan class="prompt-host">yuuki@github</tspan><tspan class="prompt-path">:~$</tspan> <tspan class="command">git shortlog -sn --all | head -1</tspan></tspan>
<tspan x="300" y="420" class="terminal-row" style="animation-delay:13.65s"><tspan class="dim">   </tspan><tspan class="value" id="commit_data">491</tspan><tspan class="dim" id="commit_data_dots"></tspan><tspan class="dim">  YuukiFST</tspan></tspan>
<tspan x="300" y="460" class="terminal-row" style="animation-delay:15.05s"><tspan class="prompt-host">yuuki@github</tspan><tspan class="prompt-path">:~$</tspan> <tspan class="command">gh api graphql --field query=contributions</tspan></tspan>
