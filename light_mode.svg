<tspan x="300" y="190" class="terminal-row" style="animation-delay:5.60s"><tspan class="dim"> </tspan><tspan class="key">Role    </tspan><tspan class="dim">· </tspan><tspan class="value">Fullstack</tspan></tspan>
<tspan x="300" y="220" class="terminal-row" style="animation-delay:6.65s"><tspan class="dim"> » </tspan><tspan class="key">Backend:    </tspan><tspan class="value">Python, Django, Go, tRPC, Prisma</tspan></tspan>
<tspan x="300" y="240" class="terminal-row" style="animation-delay:7.35s"><tspan class="dim"> » </tspan><tspan class="key">Frontend:   </tspan><tspan class="value">React, Next.js, TypeScript, Tailwind, shadcn/ui</tspan></tspan>
<tspan x="300" y="260" class="terminal-row" style="animation-delay:8.05s"><tspan class="dim"> » </tspan><tspan class="key">Databases:  </tspan><tspan class="value">PostgreSQL, Neon, Supabase</tspan></tspan>
<tspan x="300" y="280" class="terminal-row" style="animation-delay:8.75s"><tspan class="dim"> » </tspan><tspan class="key">DevOps:     </tspan><tspan class="value">Docker, Git, Linux, Cloudinary</tspan></tspan>
<tspan x="300" y="320" class="terminal-row" style="animation-delay:10.15s"><tspan class="prompt-host">yuuki@github</tspan><tspan class="prompt-path">:~$</tspan> <tspan class="command">cat ~/links</tspan></tspan>
<tspan x="300" y="340" class="terminal-row" style="animation-delay:10.85s"><tspan class="dim"> </tspan><tspan class="key">portfolio</tspan><tspan class="dim">  → </tspan><tspan class="value">fausto-yuuki.vercel.app</tspan></tspan>
