<tspan x="300" y="520" class="terminal-row" style="animation-delay:17.15s"><tspan class="prompt-host">yuuki@github</tspan><tspan class="prompt-path">:~$</tspan> <tspan class="command"/><tspan class="cursor">█</tspan></tspan>
</text>
</svg>